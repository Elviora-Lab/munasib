# Hourly abandoned-cart web push.
#
# Vercel Hobby only allows once-per-day crons, so this schedule lives in GitHub
# Actions instead of vercel.json. Requires repo secret:
#   CRON_SECRET — same value as Vercel Production CRON_SECRET
#
name: Abandoned cart push

on:
  schedule:
    # Every hour at :00 UTC (GitHub may delay a few minutes under load)
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: abandoned-cart-push
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call production cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_URL: https://munasib.pk/api/v1/cron/abandoned-cart-push
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set"
            exit 1
          fi
          curl -fsS --retry 2 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: github-actions-abandoned-cart-push" \
            "$CRON_URL"
          echo
